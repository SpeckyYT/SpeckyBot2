[package]
name = "speckybot2"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.103"
ascii_table = "5.0.0"
dashmap = { version = "6.2.1", features = ["rayon"] }
dotenv = "0.15.0"
futures = "0.3.33"
hextool = "0.1.3"
ilog = "1.0.3"
itertools = "0.15.0"
lazy_static = "1.5.0"
rand = "0.10.2"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "chrono", "cache"] }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"

speckycards = { path = "../speckycards" }
