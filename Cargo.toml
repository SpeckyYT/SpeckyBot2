[package]
name = "speckybot2"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
anyhow = "1.0.103"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "chrono", "cache"] }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
lazy_static = "1.5.0"
ahash = "0.8.12"
rand = "0.10.2"
hextool = "0.1.3"
ascii_table = "5.0.0"
itertools = "0.15.0"
