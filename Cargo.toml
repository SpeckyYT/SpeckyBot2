[workspace]
members = [
    "speckybot",
]
resolver = "3"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1.0.104"
ascii_table = "5.0.0"
base-traits = "0.2.0"
dashmap = { version = "6.2.1", features = ["rayon"] }
dotenv = "0.15.0"
enum-map = "3.1.0"
futures = "0.3.34"
hextool = "0.1.3"
ilog = "1.0.4"
itertools = "0.15.0"
proc-macro2 = "1.0.107"
rand = "0.10.3"
syn = { version = "3.0.10", features = ["full", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[profile.dev]
debug = "line-directives-only"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
