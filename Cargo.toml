[workspace]
members = [
    "speckybot",
]
resolver = "3"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1.0.103"
ascii_table = "5.0.0"
dashmap = { version = "6.2.1", features = ["rayon"] }
dotenv = "0.15.0"
futures = "0.3.33"
hextool = "0.1.3"
ilog = "1.0.3"
itertools = "0.15.0"
lazy_static = "1.5.0"
rand = "0.10.2"
tracing = "0.1.44"

[profile.dev]
debug = "line-directives-only"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
